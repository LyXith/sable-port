name: Build and Release

on:
  push:
    branches:
      - '**'        # 任意分支 push 都触发
    tags:
      - 'v*'        # 打 tag 时也触发（用于正式发布）
  workflow_dispatch:   # 手动触发
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: ''
      release_name:
        description: 'Release name'
        required: false
        default: ''

permissions:
  contents: write   # 上传 Release 需要写权限

jobs:
  build:
    name: Build with JDK 25
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'   # 若无 25 可改 'zulu' / 'oracle'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      # 计算本次 Release 的 tag（push tag / 手动输入 / 默认用短 SHA）
      - name: Resolve release tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="build-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ steps.vars.outputs.tag }}
          path: build/libs/*

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || steps.vars.outputs.tag }}
          files: build/libs/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ !startsWith(steps.vars.outputs.tag, 'v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
