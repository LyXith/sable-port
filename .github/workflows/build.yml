name: Build and Release

on:
  push:
    branches:
      - '**'        # 任意分支 push 只构建，不发布
    tags:
      - 'v*'        # tag push 也只构建，不发布（按你要求）
  workflow_dispatch:   # 只有手动触发才会创建 Release
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: ''
      release_name:
        description: 'Release name'
        required: false
        default: ''

permissions:
  contents: write   # 上传 Release 需要写权限

jobs:
  build:
    name: Build with JDK 25
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      # 计算 artifact 名（普通 push / tag push 也有唯一标识）
      - name: Resolve artifact name
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            NAME="${GITHUB_REF#refs/tags/}"
          else
            NAME="build-${GITHUB_SHA::7}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ steps.vars.outputs.name }}
          path: build/libs/*

      # 只有手动触发时才创建 Release
      - name: Create / Update GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.tag_name }}
          files: build/libs/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
