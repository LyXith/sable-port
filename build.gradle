plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.ryanhcode.dev/releases' }
    maven { url = 'https://maven.ryanhcode.dev/snapshots' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

base {
    archivesName = "sable-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

sourceSets {
    main {
        java {
            exclude 'dev/ryanhcode/sable/fabric/mixin/compatibility/sodiumextras/**'
            exclude 'dev/ryanhcode/sable/fabric/mixin/dynamic_directional_shading/**'
            exclude 'dev/ryanhcode/sable/mixin/debug_render/DebugRendererMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/debug_render/DebugScreenOverlayMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/water_occlusion/**'
            exclude 'dev/ryanhcode/sable/mixinhelpers/compatibility/shouldersurfing/**'
            exclude 'dev/ryanhcode/sable/render/region/SimpleCulledRenderRegion.java'
            exclude 'dev/ryanhcode/sable/sublevel/render/staging/DSAStagingBuffer.java'
            exclude 'dev/ryanhcode/sable/sublevel/render/vanilla/SingleBlockSubLevelWrapper.java'
            exclude 'dev/ryanhcode/sable/mixin/plot/lighting/BlockAndLightGetterMixin.java'
            exclude 'dev/ryanhcode/sable/mixinhelpers/loaded_chunk_debug/SableChunkDebugRenderer.java'
            exclude 'dev/ryanhcode/sable/mixinhelpers/block_outline_render/**'
            exclude '**/mixinhelpers/block_outline_render/**'
            exclude 'dev/ryanhcode/sable/mixin/loaded_chunk_debug/**'
            exclude 'dev/ryanhcode/sable/mixin/udp/**'
            exclude 'dev/ryanhcode/sable/mixin/particle/TerrainParticleMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/plot/container/**'
            exclude 'dev/ryanhcode/sable/mixin/stop_lightning/**'
            exclude 'dev/ryanhcode/sable/mixin/player_freezing/LocalPlayerMixin.java'
            exclude '**/mixin/loaded_chunk_debug/**'
            exclude '**/mixin/udp/**'
            // mc26.3 renderpearl rewrite: the legacy Sodium immediate block-model
            // path (Fabric Renderer v1 render delegates, MultiBufferSource) and
            // the old debug line renderer (ShapeRenderer/RenderType.lines) no
            // longer have a 1:1 API. They are stripped exactly like the other
            // Sodium/debug compatibility files above; the vanilla section path
            // (impl.vanilla.LevelRendererMixin) remains the active renderer.
            exclude 'dev/ryanhcode/sable/mixin/sublevel_render/impl/sodium/SodiumWorldRendererMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/debug_render/SubLevelBoundsRendererMixin.java'
            exclude 'dev/ryanhcode/sable/api/client/SubLevelBlockEntityRenderRegistry.java'
            exclude 'dev/ryanhcode/sable/sublevel/render/SubLevelLightVertexConsumerProvider.java'
            // Block#updateEntityMovementAfterFallOn was removed in 26.3 (fall
            // behaviour was folded into Entity), so this redirect has no target.
            exclude 'dev/ryanhcode/sable/mixin/entity/entity_rotations_and_riding/BlockMixin.java'
            // These mixins target APIs that were reworked by the 26.3 render
            // state / interface changes, not renamed:
            //  - BlockAndTintGetter's light getters now live on the parent
            //    BlockAndLightGetter interface and are handled elsewhere.
            //  - LevelRenderer#renderBlockOutline was replaced by the submit
            //    node pipeline (submitBlockOutline/submitHitOutline).
            exclude 'dev/ryanhcode/sable/mixin/plot/lighting/BlockAndTintGetterMixin.java'
            exclude 'dev/ryanhcode/sable/fabric/mixin/block_outline_render/LevelRendererMixin.java'
            // EntityRenderer moved to render-state generics in 26.3
            // (shouldRender(T, Frustum, ..., float), getBoundingBoxForCulling(T, float),
            // affectedByCulling(T)); this mixin is built around the old Entity signatures.
            // exclude 'dev/ryanhcode/sable/mixin/entity/entity_rendering/EntityRendererMixin.java'
        }
    }
}

configurations {
    sableCompanionRuntimeCompat
}

configurations.configureEach {
    resolutionStrategy.capabilitiesResolution.withCapability('org.lz4:lz4-java') {
        select('at.yawk.lz4:lz4-java:1.11.0')
    }
}

loom {
    accessWidenerPath = file('src/main/resources/sable.classtweaker')
    mods {
        sable { sourceSet sourceSets.main }
    }
    runs {
        client {
            client()
            name = 'Sable Fabric Client'
            runDir = 'runs/client'
        }
        server {
            server()
            name = 'Sable Fabric Server'
            runDir = 'runs/server'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly("maven.modrinth:sodium:${sodium_version}")
    compileOnly("maven.modrinth:scalablelux:${scalablelux_version}") {
        transitive = false
    }
    // Create-Fly, compile-time only: lets compatibility/create mixins reference Create types directly
    // (string @At targets are not enough when a handler signature needs one). Runtime presence is
    // gated by AbstractSableMixinPlugin, so sable still works without Create installed.
    compileOnly fileTree(dir: rootDir, include: 'create-fly-*.jar')
    if (project.findProperty('scalablelux_runtime') == 'true') {
        modLocalRuntime("maven.modrinth:scalablelux:${scalablelux_version}") {
            transitive = false
        }
    }

    include(implementation('org.apache.maven:maven-artifact:3.8.5'))
    include(implementation('at.yawk.lz4:lz4-java:1.11.0'))
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${sable_companion_version}")
    localRuntime("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${sable_companion_version}") {
        transitive = false
    }
    sableCompanionRuntimeCompat("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${sable_companion_version}") {
        transitive = false
    }
    include(implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"))
}

processResources {
    def properties = [
            version                  : project.version,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_author               : mod_author,
            description              : project.description,
            issues                   : issues,
            license                  : license,
            java_version             : java_version,
            minecraft_version        : minecraft_version,
            fabric_loader_version    : fabric_loader_version,
            fabric_version           : fabric_version,
            sodium_version           : sodium_mod_version,
            sable_companion_version  : sable_companion_version
    ]

    filesMatching(['fabric.mod.json', '*.mixins.json']) { expand properties }
    inputs.properties(properties)
    // 本地 .bak 备份不应进入发布产物
    exclude '**/*.bak'
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.compilerArgs += ["-Xmaxerrs", "1000000", "-Xmaxwarns", "1000000"]
}

jar {
    from(rootProject.file('LICENSE.md')) { rename { 'LICENSE-aeronautics.md' } }
    from(project.file('LICENSE.md')) { rename { 'LICENSE-sable.md' } }
    from({ configurations.sableCompanionRuntimeCompat.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.mods.toml'
        exclude 'META-INF/services/dev.ryanhcode.sable.companion.SableCompanion'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

